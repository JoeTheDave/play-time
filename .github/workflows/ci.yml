name: Post-deploy tests

# Rebuilt by spec 1786707286785 (central-command's universal-worker overhaul): the fast
# lane commits straight to `master` and the deploy fires from that push.
# The suite here is REPORT-ONLY — a red run is a signal to read in the thread, never a
# blocked deploy. Feature branches trigger nothing; they are no longer part of the flow.

on:
  push:
    branches: [master]

jobs:
  post-deploy-tests:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
